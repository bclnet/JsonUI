name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  prelude:
    name: Script prelude (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-prelude.js
      - name: Embedded copies are in sync
        run: python3 scripts/sync-prelude.py && git diff --exit-code

  swift-linux:
    name: Swift core (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  swift-apple:
    name: Swift package (macOS / iOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
      - name: Build for iOS Simulator
        run: xcodebuild -scheme JsonUI -destination 'generic/platform=iOS Simulator' build

  android:
    name: Android libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build and test
        working-directory: android
        run: ./gradlew --no-daemon build
